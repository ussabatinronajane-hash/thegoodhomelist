backend:
  name: git-gateway
  branch: main

# Drafts land in a pull request instead of going straight live.
publish_mode: editorial_workflow

media_folder: "public/images"
public_folder: "/images"

site_url: https://thegoodhomelist.online
display_url: https://thegoodhomelist.online
logo_url: https://thegoodhomelist.online/favicon.svg

collections:
  - name: "posts"
    label: "Guides & Reviews"
    label_singular: "Guide"
    folder: "src/content/posts"
    create: true
    slug: "{{slug}}"
    preview_path: "{{category}}/{{slug}}"
    summary: "{{title}}  ·  {{category}}"
    sortable_fields: ["pubDate", "title", "category"]
    view_groups:
      - label: "Category"
        field: category
    fields:
      - label: "Title (H1)"
        name: "title"
        widget: "string"
        hint: "Max 70 characters. Lead with the primary keyword. Example: Best Smart Plugs for Older Homes"
        pattern: ['^.{10,70}$', "Keep the title between 10 and 70 characters"]

      - label: "Meta description"
        name: "description"
        widget: "text"
        hint: "140 to 155 characters. This is what shows in Google. Write it to earn the click, not to describe the page."
        pattern: ['^.{50,160}$', "Keep the meta description between 50 and 160 characters"]

      - label: "Excerpt (2 sentences)"
        name: "excerpt"
        widget: "text"
        hint: "Two sentences, SEO optimized. Used on cards, RSS and social shares."

      - label: "Primary keyword"
        name: "primaryKeyword"
        widget: "string"
        required: false
        hint: "For your own tracking. Not published on the page."

      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Smart Home", value: "smart-home" }
          - { label: "Kitchen & Dining", value: "kitchen" }
          - { label: "Home & Living", value: "home" }
          - { label: "Garden & Patio", value: "garden" }
          - { label: "Tools & Home Improvement", value: "tools" }

      - label: "Subcategory"
        name: "subcategory"
        widget: "select"
        required: false
        hint: "Optional. Must belong to the category above, or the site build will stop with an error. It decides which dropdown, section page and related guides this guide appears in."
        options:
          - { label: "Smart Home / Smart Home Lighting", value: "smart-lighting" }
          - { label: "Smart Home / Plugs and Outlets", value: "plugs-and-outlets" }
          - { label: "Smart Home / Voice Assistants and Hubs", value: "voice-assistants-and-hubs" }
          - { label: "Smart Home / Alexa Compatible", value: "alexa-compatible" }
          - { label: "Smart Home / Smart Locks and Entry", value: "smart-locks-and-entry" }
          - { label: "Smart Home / Security Cameras and Systems", value: "security-cameras" }
          - { label: "Smart Home / Detectors and Sensors", value: "detectors-and-sensors" }
          - { label: "Smart Home / Heating and Cooling", value: "heating-and-cooling" }
          - { label: "Smart Home / Vacuums and Mops", value: "vacuums-and-mops" }
          - { label: "Smart Home / Kitchen", value: "smart-kitchen" }
          - { label: "Smart Home / Home Entertainment", value: "home-entertainment" }
          - { label: "Smart Home / WIFI and Networking", value: "wifi-and-networking" }
          - { label: "Smart Home / Pet", value: "smart-pet" }
          - { label: "Smart Home / Lawn and Garden", value: "smart-lawn-and-garden" }
          - { label: "Kitchen & Dining / Cookware", value: "cookware" }
          - { label: "Kitchen & Dining / Bakeware", value: "bakeware" }
          - { label: "Kitchen & Dining / Kitchen Utensils & Gadgets", value: "utensils-and-gadgets" }
          - { label: "Kitchen & Dining / Small Appliances", value: "small-appliances" }
          - { label: "Kitchen & Dining / Coffee, Tea & Espresso Appliances", value: "coffee-tea-espresso" }
          - { label: "Kitchen & Dining / Bar Tools & Drinkware", value: "bar-tools" }
          - { label: "Kitchen & Dining / Glassware & Drinkware", value: "glassware" }
          - { label: "Kitchen & Dining / Wine Accessories", value: "wine-accessories" }
          - { label: "Kitchen & Dining / Home Brewing & Wine Making", value: "home-brewing" }
          - { label: "Kitchen & Dining / Dining & Entertaining", value: "dining-and-entertaining" }
          - { label: "Kitchen & Dining / Kitchen & Table Linens", value: "kitchen-linens" }
          - { label: "Kitchen & Dining / Storage & Organization", value: "kitchen-storage" }
          - { label: "Home & Living / Bath", value: "bath" }
          - { label: "Home & Living / Bedding", value: "bedding" }
          - { label: "Home & Living / Furniture", value: "furniture" }
          - { label: "Home & Living / Kids' Home Store", value: "kids-home" }
          - { label: "Home & Living / Home Décor", value: "home-decor" }
          - { label: "Home & Living / Wall Décor", value: "wall-decor" }
          - { label: "Home & Living / Seasonal Décor", value: "seasonal-decor" }
          - { label: "Home & Living / Party Supplies", value: "party-supplies" }
          - { label: "Home & Living / Cleaning Supplies", value: "cleaning-supplies" }
          - { label: "Home & Living / Vacuums & Floor Care", value: "vacuums-and-floor-care" }
          - { label: "Home & Living / Irons & Steamers", value: "irons-and-steamers" }
          - { label: "Home & Living / Heating, Cooling & Air Quality", value: "air-quality" }
          - { label: "Home & Living / Storage & Organization", value: "storage-and-organization" }
          - { label: "Garden & Patio / Patio Furniture & Accessories", value: "patio-furniture" }
          - { label: "Garden & Patio / Grills & Outdoor Cooking", value: "grills-outdoor-cooking" }
          - { label: "Garden & Patio / Outdoor Heating", value: "outdoor-heating" }
          - { label: "Garden & Patio / Outdoor Décor", value: "outdoor-decor" }
          - { label: "Garden & Patio / Pools, Hot Tubs & Supplies", value: "pools-and-hot-tubs" }
          - { label: "Garden & Patio / Gardening", value: "gardening" }
          - { label: "Garden & Patio / Backyard Birding & Wildlife", value: "birding-and-wildlife" }
          - { label: "Garden & Patio / Pest Control", value: "pest-control" }
          - { label: "Garden & Patio / Farm & Ranch", value: "farm-and-ranch" }
          - { label: "Garden & Patio / Mowers & Outdoor Power Tools", value: "mowers-and-power-tools" }
          - { label: "Garden & Patio / Generators & Portable Power", value: "generators" }
          - { label: "Garden & Patio / Snow Removal", value: "snow-removal" }
          - { label: "Garden & Patio / Outdoor Storage", value: "outdoor-storage" }
          - { label: "Tools & Home Improvement / Power & Hand Tools", value: "power-and-hand-tools" }
          - { label: "Tools & Home Improvement / Air Tools", value: "air-tools" }
          - { label: "Tools & Home Improvement / Measuring & Layout Tools", value: "measuring-and-layout" }
          - { label: "Tools & Home Improvement / Building Supplies", value: "building-supplies" }
          - { label: "Tools & Home Improvement / Hardware", value: "hardware" }
          - { label: "Tools & Home Improvement / Paint, Wall Treatments & Supplies", value: "paint-and-walls" }
          - { label: "Tools & Home Improvement / Electrical", value: "electrical" }
          - { label: "Tools & Home Improvement / Plumbing", value: "plumbing" }
          - { label: "Tools & Home Improvement / Kitchen & Bath Fixtures", value: "kitchen-bath-fixtures" }
          - { label: "Tools & Home Improvement / Lighting & Ceiling Fans", value: "lighting-and-fans" }
          - { label: "Tools & Home Improvement / Appliances", value: "appliances" }
          - { label: "Tools & Home Improvement / Safety & Security", value: "safety-and-security" }
          - { label: "Tools & Home Improvement / Storage & Home Organization", value: "tool-storage" }

      - label: "Published date"
        name: "pubDate"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true

      - label: "Last updated"
        name: "updatedDate"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
        required: false
        hint: "Bump this whenever you refresh the guide. It shows on the page and in schema."

      - label: "Featured image"
        name: "image"
        widget: "image"
        required: false
        hint: "1200x675 WebP works best. Compress before uploading."

      - label: "Image alt text"
        name: "imageAlt"
        widget: "string"
        required: false
        hint: "Describe the image for a person who cannot see it. Work the keyword in naturally, do not stuff it."

      - label: "Feature on homepage"
        name: "featured"
        widget: "boolean"
        default: false
        required: false

      - label: "Draft"
        name: "draft"
        widget: "boolean"
        default: false
        required: false
        hint: "Drafts are excluded from the build, sitemap and RSS."

      - label: "Author"
        name: "author"
        widget: "string"
        default: "Rona Jane Sabatin"

      - label: "FAQs"
        name: "faqs"
        widget: "list"
        required: false
        label_singular: "FAQ"
        summary: "{{fields.question}}"
        hint: "These render as an accordion and generate FAQPage schema. Pull real questions from People Also Ask."
        fields:
          - { label: "Question", name: "question", widget: "string" }
          - { label: "Answer", name: "answer", widget: "text", hint: "40 to 60 words. Answer directly in the first sentence for featured snippet chances." }

      - label: "Related guide slugs"
        name: "related"
        widget: "list"
        required: false
        field: { label: "Slug", name: "slug", widget: "string" }
        hint: "Optional. Leave empty to auto-fill from the same category."

      - label: "Body"
        name: "body"
        widget: "markdown"
        hint: "Use H2 for main sections and H3 for products. Component shortcodes are documented in README.md."

  - name: "settings"
    label: "Site Settings"
    files:
      - name: "reference"
        label: "Writing Reference (read only)"
        file: "src/content/reference.md"
        fields:
          - { label: "Notes", name: "body", widget: "markdown" }
